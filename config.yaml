# ========================================
# CLUSTERING CONFIGURATION
# ========================================
# Kompakte, klare Konfiguration für 3-stufige Analyse

# ========================================
# PREPROCESSING
# ========================================
preprocessing:
  # Imputation fehlender Werte
  imputation:
    enabled: true
    method: 'median'  # 'median' oder 'mean'
    threshold: 0.5    # Max. Anteil fehlender Werte (0-1)

  # CAGR-Glättung für statische Finanzdaten
  cagr_smoothing:
    enabled: false    # Reduziert Volatilität in Basisdaten
    years: 3          # Anzahl Jahre für CAGR-Berechnung
    fields:           # Zu glättende Felder (optional, sonst default)
      - revt
      - at
      - ebit
      - ebitda
      - oancf

# ========================================
# ANALYSIS MODE (NEU: Exposé-Anforderung)
# ========================================
analysis:
  mode: 'sequential'  # 'sequential' oder 'unified'

  # Sequential Mode (Standard):
  #   - 3 separate Analysen: static → dynamic → combined
  #   - Separate Clusterings für jede Dimension
  #   - Beste Vergleichbarkeit zwischen Dimensionen

  # Unified Mode:
  #   - EINE Analyse mit allen Features zusammen
  #   - Static + Dynamic Features gleichzeitig im Clustering
  #   - Ganzheitliche Unternehmensbetrachtung
  #   - Schnellere Ausführung (nur 1 Clustering statt 3)

# ========================================
# CLUSTERING ALGORITHM
# ========================================
classification:
  algorithm: 'kmeans, hierarchical, dbscan'  # Verfügbar: kmeans, hierarchical, dbscan

  # K-Means spezifische Parameter
  kmeans:
    n_init: 20          # Anzahl Initialisierungen
    max_iter: 300       # Maximum Iterationen
    algorithm: 'lloyd'  # K-Means Algorithmus-Variante

  # Hierarchical Clustering Parameter
  hierarchical:
    linkage: 'ward'              # Linkage-Methode (ward, complete, average, single)
    distance_metric: 'euclidean' # Distanzmetrik (euclidean für ward erforderlich)

  # DBSCAN Parameter (Density-Based)
  dbscan:
    eps: 1.5           # Maximaler Abstand zwischen Punkten (kritischer Parameter!)
    min_samples: 3     # Minimale Anzahl Punkte für Core-Punkt
    metric: 'euclidean'  # Distanzmetrik
    # Hinweis: n_clusters wird automatisch gefunden
    # eps=1.5 ist optimal für standardisierte Finanzdaten (0.5 war zu klein → nur Noise)
    # Erwarte mit diesen Werten: 4-8 Cluster mit 5-15% Noise

# ========================================
# CLUSTER-ANZAHL (K-SELECTION)
# ========================================
cluster_selection:
  mode: 'manual'  # 'auto' oder 'manual'
  k_range: [2, 10]  # Range für automatische Bestimmung
  methods: ['elbow', 'silhouette', 'gap']  # Methoden für auto-Modus

static_analysis:
  n_clusters: 5  # Wird verwendet wenn mode='manual'

dynamic_analysis:
  n_clusters: 5
  min_years_required: 5  # Minimum Jahre pro Unternehmen

combined_analysis:
  n_clusters: 6
  weights:
    static: 0.4   # 40% Gewicht auf aktuellen Status
    dynamic: 0.6  # 60% Gewicht auf Entwicklung

# ========================================
# FEATURES
# ========================================
# Zwei Modi verfügbar:
# 1. Preset-Modus: Nutzt vordefinierte Feature-Sets aus features_config.yaml
# 2. Manual-Modus: Explizite Feature-Liste (wie bisher)

feature_selection:
  mode: 'preset'  # 'preset' oder 'manual'
  preset: 'pca_optimized'  # Wenn mode=preset: minimal, standard, comprehensive, pca_optimized

# ========================================
# MANUAL MODE FEATURES (wenn mode='manual')
# ========================================
static_analysis:
  features:
    # Profitability (erweitert)
    - roa
    - roe
    - ebit_margin
    - gross_margin
    - roc

    # Liquidity
    - current_ratio
    - working_capital_ratio

    # Leverage
    - debt_to_equity
    - equity_ratio
    - interest_coverage

    # Efficiency
    - asset_turnover
    - capital_intensity

    # Cashflow
    - fcf_margin
    - cash_conversion

    # Structure
    - financial_leverage

dynamic_analysis:
  features:  # Automatisch ergänzt mit _trend, _volatility, etc.
    - roa
    - roe
    - ebit_margin
    - revt
    - debt_to_equity
    - fcf  # NEU: Free Cash Flow
    - capex  # NEU: Capital Expenditures

combined_analysis:
  features_static:
    - roa
    - roe
    - ebit_margin
    - gross_margin
    - fcf_margin
    - current_ratio
    - debt_to_equity
    - financial_leverage

  features_dynamic:
    - roa_trend
    - margin_trend
    - leverage_trend
    - revenue_growth
    - fcf_growth
    - margin_volatility
    - growth_quality

# Unified Analysis (für analysis.mode='unified')
unified_analysis:
  n_clusters: 5
  # Features werden automatisch kombiniert aus:
  # - Alle static_analysis.features
  # - Alle dynamic_analysis.features (mit Suffixen)

# ========================================
# DATA & MARKET SETTINGS
# ========================================
data:
  market: 'germany'  # oder 'auto' für automatische Erkennung
  input_dir: 'data/raw'
  output_dir: 'output'

# ========================================
# GLOBAL SETTINGS
# ========================================
global:
  random_state: 42

# ========================================
# SCORING SYSTEM
# ========================================
scoring:
  enabled: true  # Enable/disable scoring module
  methods:
    - proximity  # Distance to cluster center
    - dimensional  # Per-category scores (Profitability, Leverage, etc.)
    - relative  # Z-score vs cluster average
    - overall  # Weighted combination
  weights:
    proximity: 0.3
    dimensional: 0.4
    relative: 0.3
  thresholds:
    excellent: 0.8  # Top 20%
    good: 0.6       # Top 40%
    average: 0.4    # Middle 40%
    poor: 0.2       # Bottom 40%

# ========================================
# CLUSTER NAMING
# ========================================
naming:
  enabled: true
  method: 'hybrid'  # Options: 'hybrid', 'technical', 'business'
  # hybrid: Business archetype + technical details (recommended)
  # technical: Only dominant features with values
  # business: Only business archetype (e.g., "Growth Champion")

# ========================================
# VALIDATION
# ========================================
validation:
  enabled: true
  external_labels:
    - gics_sector  # GICS industry classification
    - size_category  # Company size (small, medium, large)
    # - country  # Uncomment if multi-country analysis
  cramers_v_threshold: 0.3  # Minimum for "meaningful" association
  algorithm_comparison:
    enabled: true  # Compare multiple algorithms
    min_ari: 0.5  # Minimum ARI for "good agreement"

# ========================================
# PCA INTEGRATION
# ========================================
pca:
  enabled: false  # Enable PCA preprocessing (dimensionality reduction)
  run_before_clustering: true  # Apply PCA BEFORE clustering (recommended)
  n_components: 0.90  # Preserve 90% variance (or int for exact number)
  compare_spaces: false  # Compare clustering in original vs PCA space (for validation)

# ========================================
# VISUALIZATION
# ========================================
visualization:
  dpi: 300  # High resolution for publications
  format: 'png'  # Output format (png, pdf, svg)

  score_plots:
    - distribution  # Box plots per cluster
    - evolution  # Static → Dynamic → Combined
    - radar  # Dimensional profiles
    - ranking  # Top/Bottom companies
    - homogeneity  # Cluster consistency
    - correlations  # Score correlations

  validation_plots:
    - ari_heatmap  # Algorithm agreement
    - confusion_matrix  # Pairwise comparisons
    - cramers_v  # External label associations
    - contingency  # Cluster × Label overlap

  pca_plots:
    - scree  # Variance explained
    - loadings  # Feature contributions
    - biplot  # Observations + features
    - comparison  # PCA vs Original

# ========================================
# OUTPUT SETTINGS
# ========================================
output:
  create_plots: true
  create_company_lists: true
  create_summary_report: true  # Generate Markdown summary
  excel_enhanced: true  # Multi-sheet Excel with formatting

  # 5-Level Output Structure
  levels:
    1_cluster_quality:
      - scores
      - naming
      - visualizations
    2_algorithm_congruence:
      - ari_matrix
      - confusion_matrices
      - consensus_clusters
    3_external_validation:
      - cramers_v
      - contingency_tables
      - chi_square_tests
    4_company_insights:
      - rankings
      - outliers
      - migrations
    5_pca_analysis:
      - comparison
      - loadings
      - reconstructions

# ========================================
# INTERACTIVE MODE PRESETS
# ========================================
# Diese Presets können im Interactive Mode ausgewählt werden
# Du kannst die Presets hier anpassen für deine bevorzugten Setups
interactive:
  presets:
    quick_test:
      name: "Quick Test"
      description: "Schneller Test mit K-Means, nur Static, keine Plots"
      algorithms:
        - kmeans
      analyses:
        - static
      kmeans_mode: comparative
      skip_preprocessing: true
      create_plots: false
      comparison_mode: false
      # Extended features
      enable_scoring: false
      enable_naming: false
      enable_validation: false
      enable_pca: false

    full_analysis:
      name: "Full Analysis"
      description: "Komplette Analyse mit allen Algorithmen und Modi + alle Features"
      algorithms:
        - kmeans
        - hierarchical
        - dbscan
      analyses:
        - static
        - dynamic
        - combined
      kmeans_mode: both  # comparative + hierarchical
      hierarchical_mode: hierarchical
      dbscan_mode: hierarchical
      skip_preprocessing: false
      create_plots: true
      comparison_mode: true
      # Extended features - ALL ENABLED
      enable_scoring: true
      enable_naming: true
      naming_method: hybrid
      enable_validation: true
      enable_pca: true  # Optional, da rechenintensiv

    comparison_mode:
      name: "Comparison Mode"
      description: "Vergleich aller Algorithmen (nur Combined) mit Validation"
      algorithms:
        - kmeans
        - hierarchical
        - dbscan
      analyses:
        - combined
      kmeans_mode: hierarchical
      hierarchical_mode: hierarchical
      dbscan_mode: hierarchical
      skip_preprocessing: true
      create_plots: false
      comparison_mode: true
      # Extended features
      enable_scoring: true
      enable_naming: true
      naming_method: hybrid
      enable_validation: true
      enable_pca: false

    kmeans_exploration:
      name: "K-Means Exploration"
      description: "Vergleich beider K-Means Modi (Comparative vs Hierarchical)"
      algorithms:
        - kmeans
      analyses:
        - static
        - dynamic
        - combined
      kmeans_mode: both
      skip_preprocessing: true
      create_plots: true
      comparison_mode: false
      # Extended features
      enable_scoring: true
      enable_naming: true
      naming_method: technical
      enable_validation: false
      enable_pca: false

    dbscan_tuning:
      name: "DBSCAN Tuning"
      description: "DBSCAN mit Parameter-Tuning bei Problemen"
      algorithms:
        - dbscan
      analyses:
        - static
        - dynamic
        - combined
      dbscan_mode: hierarchical
      skip_preprocessing: true
      create_plots: false
      comparison_mode: false
      auto_tune_dbscan: true  # Fragt bei >50% Noise nach Parameter-Anpassung
      # Extended features
      enable_scoring: false
      enable_naming: false
      enable_validation: false
      enable_pca: false
