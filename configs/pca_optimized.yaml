# ========================================
# PCA-OPTIMIZED CONFIG
# ========================================
# Für Analysen mit vielen Features + Dimensionsreduktion
# Empfohlen für: Wenn minimal_quick nicht zufriedenstellend war

preprocessing:
  imputation:
    enabled: true
    method: 'median'
    threshold: 0.5
  cagr_smoothing:
    enabled: false
  outlier_detection:
    enabled: true
    method: 'iqr'
    iqr_multiplier: 1.3  # Etwas strenger für klarere Cluster
  scaling:
    method: 'standard'

analysis:
  mode: 'sequential'

classification:
  algorithm: 'kmeans'
  kmeans:
    n_init: 100  # Sehr stabil
    max_iter: 500

cluster_selection:
  mode: 'auto'
  k_range: [4, 8]
  methods: ['silhouette', 'gap']  # Gap-Statistik für PCA

feature_selection:
  mode: 'preset'
  preset: 'standard'  # 10-15 Features
  correlation_threshold: 0.7  # Strenger

# PCA: AKTIVIERT für viele Features
pca:
  enabled: true
  run_before_clustering: true
  n_components: 0.90  # Behalte 90% Varianz
  compare_spaces: true  # Vergleich Original vs PCA

static_analysis:
  features:
    # Profitability (5)
    - roa
    - roe
    - ebit_margin
    - gross_margin
    - roc
    # Liquidity (2)
    - current_ratio
    - quick_ratio
    # Leverage (3)
    - debt_to_equity
    - equity_ratio
    - interest_coverage
    # Efficiency (2)
    - asset_turnover
    - capital_intensity
    # Cashflow (2)
    - fcf_margin
    - cash_conversion

dynamic_analysis:
  min_years_required: 4
  features:
    - roa
    - roe
    - ebit_margin
    - revenue
    - debt_to_equity
    - fcf

combined_analysis:
  weights:
    static: 0.5
    dynamic: 0.5

data:
  market: 'germany'
  input_dir: 'data/raw'
  output_dir: 'output'
  file_selection:
    germany:
      - 'dax40_proxy.csv'
      - 'mdax_proxy.csv'
      - 'sdax_proxy.csv'

global:
  random_state: 42

validation:
  enabled: true
  external_labels:
    - gics_sector

visualization:
  plots:
    cluster_distribution: true
    cluster_characteristics: true
    pca_clusters: true  # PCA Visualisierung
    detailed_pca: true

  pca_plots:
    - scree
    - loadings
    - biplot
    - comparison

output:
  create_plots: true
  create_company_lists: true
  create_summary_report: true
  levels:
    5_pca_analysis:  # Aktiviert!
      - comparison
      - loadings
      - reconstructions
